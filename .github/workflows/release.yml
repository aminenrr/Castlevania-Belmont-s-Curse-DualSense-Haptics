name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build source/BelmontHaptics -c Release
      - name: Package
        run: |
          out=pkg/BepInEx/plugins/BelmontHaptics
          mkdir -p "$out"
          cp source/BelmontHaptics/bin/Release/net6.0/{BelmontHaptics.dll,NAudio.Core.dll,NAudio.Wasapi.dll} "$out"/
          cp README.md LICENSE pkg/
          (cd pkg && zip -qr "../BelmontHaptics-${GITHUB_REF_NAME}.zip" .)
      - name: Release notes
        run: |
          ver="${GITHUB_REF_NAME}"
          awk -v v="## $ver" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: BelmontHaptics-${{ github.ref_name }}.zip
          body_path: notes.md
