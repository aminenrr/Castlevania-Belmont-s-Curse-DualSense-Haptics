name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build source/BelmontHaptics -c Release
      - name: Package
        run: |
          out=pkg/BepInEx/plugins/BelmontHaptics
          mkdir -p "$out"
          cp source/BelmontHaptics/bin/Release/net6.0/{BelmontHaptics.dll,NAudio.Core.dll,NAudio.Wasapi.dll} "$out"/
          cp README.md LICENSE pkg/
          (cd pkg && zip -qr "../BelmontHaptics-${GITHUB_REF_NAME}.zip" .)
      - name: Release notes
        run: |
          ver="${GITHUB_REF_NAME}"
          awk -v v="## $ver" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: BelmontHaptics-${{ github.ref_name }}.zip
          body_path: notes.md
